name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Install pods
        run: |
          cd ios
          pod install
      - name: 写入ATS放行
        run: |
          cd ios/Runner
          plutil -replace NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}' Info.plist
      - name: Build IPA (no sign)
        run: flutter build ipa --release --no-codesign
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wild-ios-unsigned
          path: build/ios/ipa/*.ipa
